<!DOCTYPE html>
<html lang="en">

<head>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:Arial,Helvetica,sans-serif;
}

  max-width:760px;
  margin:auto;
  padding:16px;

.card{

.muted{

.row{

.btn{

<body>

<div class="app">

<!-- EXCEL -->

<script
src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">

<!-- PDF -->

src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js">

src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js">

<script>


/* =====================================================
   BUSINESS DETAILS
===================================================== */

const BUSINESS_NAME =
"I M ENTERPRISES";

const GSTIN =
"29BPZPJ1392D1ZE";

const ADDRESS =
"Mahal Mas Opp Mahtar Mahal Masjid, PID-23427, Ward No. 7A, CTS-67, CR-53, Jamiya Masjid Road, Vijayapura, Karnataka - 586101";


/* =====================================================
   VARIABLES
===================================================== */

let invoices = [];

let summary = [];


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
document.getElementById(id);


function money(value){

  const n = Number(value || 0);

  return n.toLocaleString(
    "en-IN",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function number(value){

  const n = Number(value);

  return isFinite(n) ? n : 0;

}


function getValue(row,key){

  if(row[key] !== undefined)
    return row[key];

  const compact =
    key.replace(/ /g,"");

  if(row[compact] !== undefined)
    return row[compact];

  return "";

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

  if(
    value instanceof Date &&
    !isNaN(value)
  ){

    return String(
      value.getDate()
    ).padStart(2,"0")
    + "-"
    +
    String(
      value.getMonth()+1
    ).padStart(2,"0")
    + "-"
    +
    value.getFullYear();

  }


  if(typeof value === "number"){

    const d =
      new Date(
        Math.round(
          (value - 25569) *
          86400 *
          1000
        )
      );

    if(!isNaN(d))
      return formatDate(d);

  }


  const d =
    new Date(value);

  if(!isNaN(d))
    return formatDate(d);

  return "";

}


/* =====================================================
   CLEAN SALE BILLS
===================================================== */

function cleanInvoices(rows){

  return rows
    .filter(row =>
      getValue(row,"Invoice No.")
    )
    .filter(row =>
      !String(
        getValue(row,"Invoice No.")
      )
      .toUpperCase()
      .includes("TOTAL")
    );

}


/* =====================================================
   EXCEL UPLOAD
===================================================== */

$("file").addEventListener(
"change",
async function(event){

  const file =
    event.target.files[0];

  if(!file)
    return;


  try{

    $("status").textContent =
      "Reading Excel file…";


    const buffer =
      await file.arrayBuffer();


    const workbook =
      XLSX.read(
        buffer,
        {
          type:"array",
          cellDates:true
        }
      );


    /* Sale Bills */

    if(
      !workbook.SheetNames.includes(
        "Sale Bills"
      )
    ){

      throw new Error(
        'Sheet "Sale Bills" not found.'
      );

    }


    const saleRows =
      XLSX.utils.sheet_to_json(
        workbook.Sheets["Sale Bills"],
        {
          defval:""
        }
      );


    invoices =
      cleanInvoices(
        saleRows
      );


    /* GSTR-1 */

    if(
      workbook.SheetNames.includes(
        "GSTR-1 Summary"
      )
    ){

      summary =
        XLSX.utils.sheet_to_json(
          workbook.Sheets[
            "GSTR-1 Summary"
          ],
          {
            defval:""
          }
        );

    }
    else{

      summary=[];

    }


    /* Statistics */

    $("invoiceCount").textContent =
      invoices.length;


    const sales =
      invoices.reduce(
        (total,row) =>
          total +
          number(
            getValue(
              row,
              "Invoice Value"
            )
          ),
        0
      );


    $("totalSales").textContent =
      "₹"+money(sales);


    $("gstrRows").textContent =
      summary.length;


    $("generate").disabled =
      invoices.length === 0;


    $("status").textContent =
      "Loaded "
      + invoices.length
      + " invoices and "
      + summary.length
      + " GSTR-1 summary rows.";

  }


  catch(error){

    $("status").textContent =
      "Error: "
      + error.message;

    $("generate").disabled =
      true;

  }

});

/* =====================================================

    ) ||

    getValue(

    );

    number(

    },

    }

    doc.lastAutoTable.finalY + 3;

  doc.autoTable({

        "1",

          .replace(".00",""),

    ],

    columnStyles:{

        halign:"right"
      },

        cellWidth:30,

        cellWidth:34,

    },

    styles:{
      font:"helvetica",
      fontSize:6.2,
      cellPadding:3,

    },

  y =

  /* =================================================

  doc.autoTable({

    body:[

        money(totalGST)

      },

      2:{

      cellPadding:3,
      lineColor:[0,0,0],

    },

    }

  });


  y =
    doc.lastAutoTable.finalY + 3;


  /* =================================================
     TOTALS
  ================================================= */

  doc.autoTable({

    startY:y,

    },

    theme:"grid",

      ],

    },

/* =====================================================
   GSTR-1 REPORT
===================================================== */

  drawHeader(doc);


  doc.setFont(
    "helvetica",
    "bold"
  );

  doc.setFontSize(10);


  doc.text(
    "GSTR-1 REPORT",
    105,
    27,
    {
      align:"center"
    }
  );


  doc.setFont(
    "helvetica",
    "normal"
  );

  doc.setFontSize(6);


  doc.text(
    "B2C Sales Summary",
    105,
    31,
    {
      align:"center"
    }
  );


  const columns=[
    "Particulars",
    "No. of Bills",
    "Taxable Value",
    "CGST",
    "SGST",
    "IGST",
    "Total GST",
    "Invoice Value"
  ];


  const body =
    summary.map(row=>{

      return columns.map(column=>{

        if(
          column ===
          "Particulars"
        ){

          return String(
            getValue(
              row,
              column
            )
          );

        }

          column ===
          "No. of Bills"
        ){

          return String(
            number(
              getValue(
                row,
                column
              )
            )
          );

        }


        return money(
          getValue(
            row,
            column
          )
        );

      });

    });


  doc.autoTable({

    startY:34,

    margin:{
      left:10,
      right:10
    },

    theme:"grid",

    head:[
      columns
    ],

    body:body,

    styles:{

      font:"helvetica",

      fontSize:5,

      cellPadding:1.7,

      lineColor:[0,0,0],

      lineWidth:.2,

      textColor:[0,0,0],

      halign:"center",

      textColor:[0,0,0]

    },

    columnStyles:{

      0:{
        cellWidth:42,
        halign:"left"
      },

      1:{
        cellWidth:20,
        halign:"right"
      },

      2:{
        cellWidth:25,
        halign:"right"
      },

      3:{
        cellWidth:21,
        halign:"right"
      },

      4:{
        cellWidth:21,
        halign:"right"
      },

      5:{
        cellWidth:20,
        halign:"right"
      },

      6:{
        cellWidth:21,
        halign:"right"
      },

      7:{
        cellWidth:20,
        halign:"right"
      }

    }

  });


  doc.setFont(
    "helvetica",
    "normal"
  );

  doc.setFontSize(5);


  doc.text(
    "Source: GSTR-1 Summary sheet from the uploaded Excel report.",
    105,
    doc.lastAutoTable.finalY+7,
    {
      align:"center"
    }
  );

}


/* =====================================================
   GENERATE PDF
===================================================== */

$("generate").addEventListener(
"click",
function(){

  if(!invoices.length)
    return;


  try{

    $("generate").disabled =
      true;


    const {
      jsPDF
    } = window.jspdf;


    /*
       IMPORTANT

       A5 LANDSCAPE

       Width  = 210 mm
       Height = 148 mm
    */

    const doc =
      new jsPDF({

        orientation:"landscape",

        unit:"mm",

        format:"a5",

        compress:true

      });


    /* Invoices */

    invoices.forEach(
      function(row,index){

        if(index > 0){

          doc.addPage();

        }


        createInvoicePage(
          doc,
          row
        );


        $("bar").style.width =
          (
            (index+1) /
            invoices.length *
            95
          )+"%";

      }
    );


    /* Final GSTR-1 */

    doc.addPage();


    createGSTR1Page(
      doc
    );


    /* Save */

    doc.save(
      "IM_Enterprises_A5_Landscape_Invoices_GSTR1.pdf"
    );


    $("bar").style.width =
      "100%";


    $("status").textContent =
      "PDF created: "
      + invoices.length
      + " invoices + 1 GSTR-1 report page.";

  }


  catch(error){

    console.error(error);

    $("status").textContent =
      "PDF error: "
      + error.message;

  }


  finally{

    $("generate").disabled =
      false;

  }

});


/* =====================================================
   PWA INSTALL
===================================================== */

let deferredPrompt = null;


window.addEventListener(
"beforeinstallprompt",
function(event){

  event.preventDefault();

  deferredPrompt =
    event;

  $("installBtn").style.display =
    "block";

});


$("installBtn").addEventListener(
"click",
async function(){

  if(!deferredPrompt)
    return;


  deferredPrompt.prompt();


  await deferredPrompt.userChoice;


  deferredPrompt =
    null;


  $("installBtn").style.display =
    "none";

});


/* =====================================================
   SERVICE WORKER
===================================================== */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register("sw.js")
        .catch(
          function(error){
            console.log(
              "Service worker:",
              error
            );
          }
        );

    }
  );

}
